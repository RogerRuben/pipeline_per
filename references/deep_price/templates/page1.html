<script>
let featureRadar=null,priceComparison=null;
let productRecords=[],selectedProductPrice=null,selectedProductName="",lastPredictedPrice=null;
const RADAR_RANGES={
    "压力_bar":[0,350],"出力_kN":[0,100],"行程_mm":[0,500],
    "速度_mm_s":[0,250],"MTBF_小时":[0,30000],"重量_kg":[0,100],
    "功率_kW":[0,20],"泄漏_mL_min":[0,50],"响应时间_ms":[0,500]
};
const RADAR_FEATURES=["压力_bar","出力_kN","行程_mm","速度_mm_s","MTBF_小时","重量_kg"];
function normalizeRadarValue(name,value){
    const range=RADAR_RANGES[name]||[0,Math.max(Math.abs(Number(value))*2,1)];
    return Math.max(0,Math.min(100,(Number(value)-range[0])/(range[1]-range[0])*100));
}
function renderResultCharts(price,features){
    if(typeof echarts==="undefined")return;
    if(price!==null&&price!==undefined&&Number.isFinite(Number(price)))lastPredictedPrice=Number(price);
    showParameterHeatmap();

// 热力图字段分组固定：性能 / 可靠性 / 环境
// min/max 不在前端写死，而是由 /api/heatmap_config 从当前数据集自动读取
const HEATMAP_FEATURES=[
    {name:"压力_bar",short:"压力",group:"性能"},
    {name:"出力_kN",short:"出力",group:"性能"},
    {name:"行程_mm",short:"行程",group:"性能"},
    {name:"速度_mm_s",short:"速度",group:"性能"},
    {name:"功率_kW",short:"功率",group:"性能"},
    {name:"流量_L_min",short:"流量",group:"性能"},

    {name:"MTBF_小时",short:"MTBF",group:"可靠性"},
    {name:"重量_kg",short:"重量",group:"可靠性"},
    {name:"泄漏_mL_min",short:"泄漏",group:"可靠性"},
    {name:"响应时间_ms",short:"响应时间",group:"可靠性"},
    {name:"维护周期_小时",short:"维护周期",group:"可靠性"},
    {name:"故障率_10e6_FH",short:"故障率",group:"可靠性"},

    {name:"固有频率_Hz",short:"固有频率",group:"环境"},
    {name:"阻尼系数",short:"阻尼系数",group:"环境"},
    {name:"冗余配置",short:"冗余配置",group:"环境"}
];

let HEATMAP_RANGES={};

function normalizeHeatmapValue(name,value){
    const range=HEATMAP_RANGES[name];
    const val=Number(value);
    if(!range||!Number.isFinite(val))return 0;

    const min=Number(range[0]);
    const max=Number(range[1]);
    if(!Number.isFinite(min)||!Number.isFinite(max))return 0;
    if(max===min)return 50;

    return Math.max(0,Math.min(100,(val-min)/(max-min)*100));
}

async function loadHeatmapConfig(){
    const chart=document.getElementById("parameterHeatmap");
    if(!chart)return;

    try{
        const response=await fetch("/api/heatmap_config");
        const result=await response.json();

        if(!response.ok||!result.success){
            throw new Error(result.error||"热力图配置读取失败");
        }

        HEATMAP_RANGES={};
        (result.features||[]).forEach(item=>{
            HEATMAP_RANGES[item.name]=[
                Number(item.min),
                Number(item.max)
            ];
        });

        const usable=HEATMAP_FEATURES.filter(item=>
            document.getElementById(item.name) && HEATMAP_RANGES[item.name]
        );

        if(!usable.length){
            chart.style.display="block";
            if(!parameterHeatmap)parameterHeatmap=echarts.init(chart);
            parameterHeatmap.clear();
            parameterHeatmap.setOption({
                title:{
                    text:"没有可用于热力图的数值特征",
                    left:"center",
                    top:"45%",
                    textStyle:{fontSize:14,fontWeight:"normal",color:"#7890aa"}
                }
            });
            return;
        }

        showParameterHeatmap();

    }catch(error){
        chart.style.display="block";
        if(!parameterHeatmap)parameterHeatmap=echarts.init(chart);
        parameterHeatmap.clear();
        parameterHeatmap.setOption({
            title:{
                text:"热力图数据读取失败："+error.message,
                left:"center",
                top:"45%",
                textStyle:{fontSize:14,fontWeight:"normal",color:"#7890aa"}
            }
        });
    }
}

function showParameterHeatmap(){
    const chart=document.getElementById("parameterHeatmap");
    if(!chart)return;
    chart.style.display="block";
    requestAnimationFrame(()=>{
        renderParameterHeatmap();
        if(parameterHeatmap)parameterHeatmap.resize();
    });
}

function renderParameterHeatmap(){
    const features=collectData();
    const groups=["性能","可靠性","环境"];

    const activeFeatures=HEATMAP_FEATURES.filter(item=>
        document.getElementById(item.name) && HEATMAP_RANGES[item.name]
    );
    if(!activeFeatures.length)return;

    const groupCounts={};
    groups.forEach(group=>{
        groupCounts[group]=activeFeatures.filter(item=>item.group===group).length;
    });

    const maxColumns=Math.max(1,...Object.values(groupCounts));
    const columns=Array.from({length:maxColumns},(_,i)=>String(i+1));
    const counts={};

    const data=activeFeatures.map(item=>{
        const row=groups.indexOf(item.group);
        const col=counts[item.group]||0;
        counts[item.group]=col+1;

        const raw=Number(features[item.name]);
        const score=Number.isFinite(raw)
            ? normalizeHeatmapValue(item.name,raw)
            : 0;
        const range=HEATMAP_RANGES[item.name];

        return {
            value:[col,row,Number(score.toFixed(1))],
            name:item.name,
            short:item.short,
            group:item.group,
            raw:Number.isFinite(raw)?raw:"-",
            min:range?range[0]:"-",
            max:range?range[1]:"-"
        };
    });

    if(!parameterHeatmap){
        parameterHeatmap=echarts.init(document.getElementById("parameterHeatmap"));
    }

    parameterHeatmap.setOption({
        tooltip:{
            formatter:p=>`${p.data.name}<br>分组：${p.data.group}<br>当前值：<b>${p.data.raw}</b><br>数据集范围：${p.data.min} ~ ${p.data.max}<br>相对水平：${p.data.value[2]}%`
        },
        grid:{left:70,right:20,top:35,bottom:45},
        xAxis:{type:"category",data:columns,show:false},
        yAxis:{
            type:"category",
            data:groups,
            axisTick:{show:false},
            axisLine:{show:false},
            axisLabel:{color:"#36566f",fontWeight:"bold"}
        },
        visualMap:{
            min:0,
            max:100,
            orient:"horizontal",
            left:"center",
            bottom:2,
            text:["高","低"],
            calculable:false,
            inRange:{color:["#eff6ff","#bfdbfe","#60a5fa","#2563eb","#172f68"]},
            textStyle:{color:"#64748b"}
        },
        series:[{
            type:"heatmap",
            data:data,
            label:{
                show:true,
                formatter:p=>`${p.data.short}\n${p.data.value[2]}%`,
                color:"#17345f",
                fontSize:10,
                lineHeight:15
            },
            itemStyle:{borderColor:"#fff",borderWidth:5,borderRadius:8},
            emphasis:{itemStyle:{shadowBlur:10,shadowColor:"rgba(30,64,175,.28)"}}
        }]
    },true);
}

let task_id = null;
let streamingTimer = null;

function savePage1State(state){

    try{
        oldState = JSON.parse(
            sessionStorage.getItem("page1PredictionState") || "{}"
        );
    }catch(e){
        oldState = {};
    }

    sessionStorage.setItem(
        "page1PredictionState",

            ...state
        })
    );
}

function restoreInputValues(features){
    if(!features)return;

    Object.keys(features).forEach(id=>{
        const el = document.getElementById(id);
        if(el){
            el.value = features[id];
        }
    });
}

function restorePage1State(){
    let state = null;

    try{
        const text = sessionStorage.getItem("page1PredictionState");
        if(!text)return;
        state = JSON.parse(text);
    }catch(e){
        console.log("恢复页面1状态失败：", e);
        return;
    }

    if(state.features){
        restoreInputValues(state.features);
        sessionStorage.setItem(
            "currentProductFeatures",
            JSON.stringify(state.features)
        );
    }

    if(state.task_id){
        task_id = state.task_id;
    }

    if(state.pred_price !== undefined && state.pred_price !== null){
        document.getElementById("price").innerHTML =
            Number(state.pred_price).toFixed(2) + " 万元";
        renderResultCharts(state.pred_price,state.features);
    }

    if(state.explain_status === "finished" && state.mechanism){
        document.getElementById("mechanismLoading").style.display = "none";
        renderMechanismInstant(state.mechanism);
        document.getElementById("status").innerHTML = "机理分析完成";
        return;
    }

    if(state.explain_status === "running" && task_id){
        document.getElementById("mechanismLoading").style.display = "block";
        document.getElementById("mechanismLoading").innerHTML =
            "正在生成关键参数影响机理分析...";
        document.getElementById("status").innerHTML =
            "价格预测完成，正在生成机理分析...";
        checkExplain();
    }
}

function renderMechanismInstant(items){
    const box = document.getElementById("mechanismAnalysis");
    box.innerHTML = "";

    if(!items || items.length === 0){
        box.innerHTML =
            '<div class="loading-text">暂无机理分析结果。</div>';
        return;
    }

    if(typeof items === "string"){
        items = [items];
    }

    items.forEach((text,index)=>{
        const item = document.createElement("div");
        item.className = "mechanism-item";

        const number = document.createElement("div");
        number.className = "mechanism-number";
        number.textContent = index + 1;

        const content = document.createElement("div");
        content.className = "mechanism-text";
        content.textContent = text;

        item.appendChild(number);
        item.appendChild(content);
        box.appendChild(item);
    });
}

function streamMechanism(items){
    if(streamingTimer){
        clearTimeout(streamingTimer);
        streamingTimer = null;
    }

    if(typeof items === "string"){
        items = [items];
    }

    const box = document.getElementById("mechanismAnalysis");
    box.innerHTML = "";

    if(!items || items.length === 0){
        box.innerHTML =
            '<div class="loading-text">暂无机理分析结果。</div>';
        return;
    }

    let itemIndex = 0;
    let charIndex = 0;
    let currentContent = null;

    function createItem(){
        const item = document.createElement("div");
        item.className = "mechanism-item";

        const number = document.createElement("div");
        number.className = "mechanism-number";
        number.textContent = itemIndex + 1;

        currentContent = document.createElement("div");
        currentContent.className = "mechanism-text";
        currentContent.textContent = "";

        item.appendChild(number);
        item.appendChild(currentContent);
        box.appendChild(item);
    }

    function step(){
        if(itemIndex >= items.length){
            streamingTimer = null;
            savePage1State({
                task_id: task_id,
                mechanism: items,
                explain_status: "finished"
            });
            document.getElementById("status").innerHTML = "机理分析完成";
            return;
        }

        const fullText = String(items[itemIndex] || "");

        if(currentContent === null){
            createItem();
        }

        if(charIndex < fullText.length){
            const chunkSize = 2;
            currentContent.textContent +=
                fullText.slice(charIndex, charIndex + chunkSize);
            charIndex += chunkSize;

            streamingTimer = setTimeout(step, 18);
        }else{
            itemIndex++;
            charIndex = 0;
            currentContent = null;
            streamingTimer = setTimeout(step, 120);
        }
    }

    step();
}

function startPredict() {
    const statusBox = document.getElementById("status");
    const priceBox = document.getElementById("price");
    const loadingBox = document.getElementById("mechanismLoading");
    const mechanismBox = document.getElementById("mechanismAnalysis");

    statusBox.innerHTML = "正在预测...";
    loadingBox.innerHTML = "正在等待价格预测...";
    loadingBox.style.display = "block";
    mechanismBox.innerHTML = "";

    const currentFeatures = collectData();

    if(streamingTimer){
        clearTimeout(streamingTimer);
        streamingTimer = null;
    }

    savePage1State({
        features: currentFeatures,
        explain_status: "predicting",
        mechanism: []
    });

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(currentFeatures)
    })
    .then(async res => {
        let data;
        try {
            data = await res.json();
        } catch (e) {
            throw new Error("服务器返回内容不是有效JSON");
        }

        if (!res.ok || data.error) {
            throw new Error(data.error || "价格预测请求失败");
        }

        return data;
    })
    .then(data => {
        task_id = data.task_id;

        // 保存当前产品输入，供页面2/3使用
        sessionStorage.setItem(
            "currentProductFeatures",
            JSON.stringify(currentFeatures)
        );

        // 保存页面1状态，切换页面后回来无需重新预测
        savePage1State({
            task_id: task_id,
            features: currentFeatures,
            pred_price: data.pred_price,
            explain_status: "running",
            mechanism: []
        });

        priceBox.innerHTML =
            Number(data.pred_price).toFixed(2) + " 万元";
        renderResultCharts(data.pred_price,currentFeatures);

        statusBox.innerHTML =
            "价格预测完成，正在生成机理分析...";

        loadingBox.innerHTML =
            "正在生成关键参数影响机理分析...";

        checkExplain();
    })
    .catch(err => {
        task_id = null;
        priceBox.innerHTML = "预测失败";
        statusBox.innerHTML = "预测失败：" + err.message;
        loadingBox.innerHTML = err.message;
        loadingBox.style.display = "block";
    });
}

// =====================================================

function checkExplain() {


    if (
        !task_id
    ) {

        return;

    }


    fetch(
        "/explain_status/"
        + task_id
    )


    .then(
        res =>
            res.json()
    )


    .then(
        data => {


            if (
                data.status ===
                "finished"
            ) {


                let d =
                    data.data;


                let explanation =
                    d.explanation
                    || {};


                let mechanism =
                    explanation
                    .mechanism_analysis
                    || [];


                if (
                    typeof mechanism
                    === "string"
                ) {


                    mechanism = [
                        mechanism
                    ];


                }


                document
                    .getElementById(
                        "mechanismLoading"
                    )
                    .style.display =
                        "none";


                savePage1State({
                    task_id: task_id,
                    mechanism: mechanism,
                    explain_status: "streaming"
                });

                streamMechanism(mechanism);


                document
                    .getElementById(
                        "status"
                    )
                    .innerHTML =
                        "机理分析已生成，正在流式展示...";


            }


            else if (
                data.status ===
                "error"
            ) {


                document
                    .getElementById(
                        "mechanismLoading"
                    )
                    .innerHTML =
                        "机理分析生成失败："
                        + (
                            data.error
                            || "未知错误"
                        );


                document
                    .getElementById(
                        "status"
                    )
                    .innerHTML =
                        "机理分析失败";


            }


            else if (
                data.status ===
                "not_found"
            ) {


                document
                    .getElementById(
                        "mechanismLoading"
                    )
                    .innerHTML =
                        "未找到机理分析任务。";


                document
                    .getElementById(
                        "status"
                    )
                    .innerHTML =
                        "任务不存在";


            }


            else {


                setTimeout(
                    checkExplain,
                    2000
                );


            }


        }
    )


    .catch(
        err => {


            document
                .getElementById(
                    "mechanismLoading"
                )
                .innerHTML =
                    "查询机理分析失败："
                    + err;


            document
                .getElementById(
                    "status"
                )
                .innerHTML =
                    "机理分析查询失败";


        }
    );
}

window.addEventListener(
    "DOMContentLoaded",
    function(){

        // 判断是否是浏览器刷新（F5 / Ctrl+R / 刷新按钮）
        const navEntries =
            performance.getEntriesByType("navigation");

        const isReload =
            navEntries.length > 0
            && navEntries[0].type === "reload";

        if(isReload){

            // 刷新页面1时清除预测状态，
            // 页面恢复为“等待预测 / 请先进行价格预测”
            sessionStorage.removeItem(
                "page1PredictionState"
            );

            sessionStorage.removeItem(
                "currentProductFeatures"
            );

            task_id = null;

            return;
        }

        // 正常从页面2/3切换回来时恢复原预测结果
        restorePage1State();
    }
);


let sensitivityChart=null;
function sensitivityFeatures(){return collectData();}
function showSensitivityMessage(message){
    sensitivityChart.clear();
    sensitivityChart.setOption({title:{text:message,left:"center",top:"45%",textStyle:{fontSize:14,fontWeight:"normal",color:"#7890aa"}}});
}
async function runSingleSensitivity(){
    const select=document.getElementById("sensitivityFeature");
    if(!select.value)return showSensitivityMessage("暂无可分析特征");
    sensitivityChart.showLoading();
    try{
        const response=await fetch("/api/sensitivity_single",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({features:sensitivityFeatures(),feature:select.value})});
        const result=await response.json();
        if(!response.ok||result.error)throw new Error(result.error||"敏感性分析失败");
        sensitivityChart.setOption({title:{text:result.feature+" 单参数敏感性分析",left:"center"},tooltip:{trigger:"axis",formatter:params=>{const item=result.data[params[0].dataIndex];return `${result.feature}：${item.feature_value}<br>预测价格：${Number(item.price).toFixed(4)} 万元<br>相对基准价格变化：${Number(item.price_change_rate).toFixed(2)}%`;}},grid:{top:70,left:90,right:45,bottom:85},xAxis:{type:"category",name:result.type==="numeric"?"参数相对当前值变化率（%）":"参数类别",data:result.data.map(item=>item.label),axisLabel:{interval:0,rotate:result.type==="categorical"?25:0}},yAxis:{type:"value",name:"预测价格（万元）",scale:true,splitLine:{lineStyle:{type:"dashed"}}},series:[{name:result.feature,type:"line",smooth:result.type==="numeric",symbol:"circle",symbolSize:9,data:result.data.map(item=>item.price)}]},true);
    }catch(error){showSensitivityMessage("敏感性分析失败："+error.message);}finally{sensitivityChart.hideLoading();}
}
async function runTop10Sensitivity(){
    sensitivityChart.showLoading();
    try{
        const response=await fetch("/api/sensitivity_top10",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({features:sensitivityFeatures()})});
        const result=await response.json();
        if(!response.ok||result.error)throw new Error(result.error||"Top10敏感性分析失败");
        sensitivityChart.setOption({title:{text:"Top10关键参数敏感性对比",left:"center"},legend:{top:35,type:"scroll"},tooltip:{trigger:"axis",valueFormatter:value=>value==null?"-":Number(value).toFixed(2)+"%"},grid:{top:100,left:90,right:45,bottom:70},xAxis:{type:"category",name:"参数相对当前值变化率（%）",data:result.change_rates.map(value=>value+"%")},yAxis:{type:"value",name:"预测价格变化率（%）",splitLine:{lineStyle:{type:"dashed"}}},series:result.series.map(item=>({name:item.feature,type:"line",smooth:true,symbol:"circle",data:item.values}))},true);
    }catch(error){showSensitivityMessage("Top10敏感性分析失败："+error.message);}finally{sensitivityChart.hideLoading();}
}
async function initSensitivity(){
    if(!sensitivityChart)sensitivityChart=echarts.init(document.getElementById("sensitivityChart"));
    showSensitivityMessage("正在加载敏感性分析参数...");
    try{
        const response=await fetch("/api/sensitivity_features",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({features:sensitivityFeatures()})}),result=await response.json();
        if(!response.ok||result.error)throw new Error(result.error||"字段读取失败");
        const select=document.getElementById("sensitivityFeature");
        select.innerHTML="";
        result.features.forEach(item=>{const option=document.createElement("option");option.value=item.feature;option.textContent=item.feature;select.appendChild(option);});
        if(result.features.length)runSingleSensitivity();else showSensitivityMessage("没有可用于敏感性分析的特征");
    }catch(error){showSensitivityMessage("敏感性字段加载失败："+error.message);}
}
document.getElementById("singleSensitivityBtn").addEventListener("click",()=>{document.getElementById("singleSensitivityBtn").className="active";document.getElementById("top10SensitivityBtn").className="secondary";document.getElementById("sensitivitySelector").style.display="inline";runSingleSensitivity();});
document.getElementById("top10SensitivityBtn").addEventListener("click",()=>{document.getElementById("top10SensitivityBtn").className="active";document.getElementById("singleSensitivityBtn").className="secondary";document.getElementById("sensitivitySelector").style.display="none";runTop10Sensitivity();});
document.getElementById("sensitivityFeature").addEventListener("change",runSingleSensitivity);
window.addEventListener("resize",()=>{if(sensitivityChart)sensitivityChart.resize();});
initSensitivity();
