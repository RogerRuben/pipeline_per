<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>成品级 V17 锁特化效能与复用评估</title>
  <style>
    :root{--ink:#14213d;--muted:#52627a;--line:#ccd7e5;--soft:#f4f7fb;--blue:#1769e0;--teal:#087f73;--green:#dff6e7;--green-ink:#17663a;--amber:#fff0c7;--amber-ink:#805800;--red:#ffe1df;--red-ink:#9b2922;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:#eef3f8;color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;font-size:17px;line-height:1.55;letter-spacing:0}button,input,select{font:inherit}button{min-height:46px;border:1px solid #aebed1;border-radius:6px;background:#fff;color:var(--ink);padding:8px 16px;cursor:pointer;font-weight:700}button:hover{border-color:var(--blue)}button.primary{background:var(--teal);border-color:var(--teal);color:#fff}button.secondary{background:#edf4ff;border-color:#aac7ed;color:#164f92}button.warn{background:#fff5e6;border-color:#e5b56b;color:#854c00}button:disabled{opacity:.55;cursor:not-allowed}.page{max-width:1560px;margin:0 auto;padding:18px}.topbar{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;margin-bottom:14px}.topbar h1{font-size:28px;margin:0 0 4px}.subtitle{color:var(--muted)}.badge{display:inline-block;border-radius:5px;padding:4px 9px;font-size:14px;font-weight:700;background:#e8eef7;color:#37506f}.badge.green{background:var(--green);color:var(--green-ink)}.badge.amber{background:var(--amber);color:var(--amber-ink)}.badge.red{background:var(--red);color:var(--red-ink)}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}.toolbar{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:14px;color:var(--muted)}select,input{border:1px solid #b8c7d9;border-radius:6px;background:#fff;color:var(--ink);padding:9px 10px;min-height:44px}.status-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-top:14px}.stat{border-left:4px solid #8fa9c8;padding:7px 11px;background:var(--soft)}.stat strong{display:block;font-size:22px}.stat span{font-size:14px;color:var(--muted)}.notice{background:#f2f7fd;border:1px solid #c9d9ec;border-radius:6px;padding:11px 13px}.notice.warn{background:#fff8e9;border-color:#ead19b}.notice.error{background:#fff0ef;border-color:#efbab5}.stage-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}.stage-head h2,.panel h2{font-size:22px;margin:0}.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}.scheme{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;min-width:0}.scheme h3{font-size:23px;margin:0}.scheme .source{color:var(--muted);margin-bottom:10px}.param-table{border-collapse:collapse;width:100%;table-layout:fixed}.param-table td{border-bottom:1px solid #e3e9f1;padding:10px 6px;vertical-align:middle}.param-table td:first-child{width:58%}.param-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}.param-label{display:block}.param-meta{display:block;color:var(--muted);font-size:13px}.param-table tr.changed{background:#fff4ca}.delta{display:block;color:#9a5e00;font-size:13px;font-weight:700}.feedback{margin-top:14px}.feedback h3{font-size:20px;margin:0 0 8px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{display:flex;flex-wrap:wrap;gap:8px}.choice label{display:flex;align-items:center;gap:7px;border:1px solid #b8c7d9;border-radius:6px;padding:9px 12px;background:#fff;cursor:pointer}.choice label:has(input:checked){background:#e8f2ff;border-color:#4d8ee8;color:#0c4e9c;font-weight:700}.choice input{min-height:auto}.actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.message{color:var(--muted)}.progress-list{display:grid;gap:9px}.boundary-row{display:grid;grid-template-columns:minmax(175px,1.1fr) minmax(260px,2.4fr) minmax(190px,1fr);gap:12px;align-items:center}.boundary-name b{display:block}.boundary-name span,.boundary-value{font-size:14px;color:var(--muted)}.track{height:18px;background:#e7edf4;border-radius:4px;position:relative;overflow:hidden}.track .accepted{position:absolute;inset:0 auto 0 0;background:#60c88a}.track .uncertain{position:absolute;top:0;bottom:0;background:#f2c94c}.track .rejected{position:absolute;top:0;bottom:0;right:0;background:#e98178}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:2px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button[aria-selected="true"]{background:#e6f0ff;border-color:#4f8ad5;color:#124f98}.tabview{display:none}.tabview.active{display:block}.curve-grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px}.curve{border:1px solid #d9e2ed;border-radius:6px;padding:10px}.curve h4{margin:0 0 6px;font-size:16px}.curve svg{display:block;width:100%;height:150px;background:#fafcff}.eval-layout{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:18px}.eval-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.eval-result{min-width:0}.scoreline{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.score{font-size:42px;font-weight:800;color:var(--teal)}.result-table{width:100%;border-collapse:collapse;margin-top:12px}.result-table th,.result-table td{text-align:left;border-bottom:1px solid #dfe6ef;padding:9px 7px;vertical-align:top}.result-table th{font-size:14px;color:var(--muted);background:#f7f9fc}.lossbar{height:10px;background:#e7edf4;border-radius:3px;overflow:hidden;min-width:90px}.lossbar span{display:block;height:100%;background:#d96b5f}.review{border-left:4px solid #d79b37;padding:10px 12px;background:#fff8e9;margin-bottom:9px}.review.must{border-left-color:#c83f35;background:#fff0ef}.review-preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.review-scheme{background:#fff;border:1px solid #d8e0eb;border-radius:6px;padding:9px;font-size:14px}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.eval-dashboard{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.chart-box{border:1px solid #d9e2ed;border-radius:6px;padding:12px;min-width:0}.chart-box h4{margin:0 0 8px;font-size:17px}.chart-svg{display:block;width:100%;height:auto}.full-span{grid-column:1/-1}.migration-curves{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:12px}.migration-curve{border:1px solid #e0e6ef;border-radius:6px;padding:9px}.migration-curve h5{margin:0 0 4px;font-size:15px}.review-banner{margin-top:10px;cursor:pointer;font-weight:700}details summary{font-weight:700;cursor:pointer}.details-body{padding-top:12px}.footer-actions{display:flex;gap:9px;flex-wrap:wrap}.empty{padding:18px;color:var(--muted);text-align:center}.hidden{display:none!important}
    .workspace-tabs{display:flex;gap:8px;margin-bottom:14px}.workspace-tabs button{background:#e2e8f0;color:#334155}.workspace-tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}.workspace.hidden{display:none!important}
    @media(max-width:960px){body{font-size:16px}.page{padding:10px}.topbar,.stage-head{display:block}.status-grid{grid-template-columns:1fr 1fr}.ab-grid,.feedback-grid,.eval-layout,.eval-dashboard{grid-template-columns:1fr}.curve-grid,.migration-curves{grid-template-columns:1fr 1fr}.boundary-row{grid-template-columns:1fr}.scheme{margin-bottom:10px}}
    @media(max-width:560px){.status-grid,.curve-grid,.eval-inputs{grid-template-columns:1fr}.topbar h1{font-size:24px}.param-table td:first-child{width:60%}.result-table{font-size:14px}.result-table th:nth-child(3),.result-table td:nth-child(3){display:none}}
  </style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="subtitle" id="projectTitle">正在载入项目...</div>
    <span class="badge">只学习效能与复用，不评估物理可行性</span>
  </header>

  <nav class="workspace-tabs" aria-label="工作区切换">
    <button type="button" data-workspace="evaluation" aria-selected="true">方案效能评估</button>
    <button type="button" data-workspace="training" aria-selected="false">UTA模型训练</button>
  </nav>

  <section id="evaluationWorkspace" class="workspace">
  <section class="panel">
    <div class="stage-head"><h2>方案效能评估</h2><span class="badge">相对当前基准</span></div>
    <div class="toolbar">
      <div class="field"><label for="profileSelect">方案效能评估基准</label><select id="profileSelect"></select></div>
      <div class="notice" id="baselineNote">基准固定100分，训练只向更差方向变化。</div>
    </div>
    <div class="eval-layout" style="margin-top:14px"><form id="evaluationForm"><div class="eval-inputs" id="evalInputs"></div><div class="actions"><button class="primary" type="submit">评估该方案</button><span class="message" id="evalMessage"></span></div></form><div class="eval-result" id="evaluationResult"><div class="empty">填写完整参数后，这里会显示总分、整机复用结论和每项属性的复用状态。</div></div></div>
  </section>
  </section>

  <section id="trainingWorkspace" class="workspace hidden">
  <section class="panel">
    <div class="status-grid" id="statusGrid"></div>
    <div id="completionText" class="notice" style="margin-top:12px"></div>
    <div id="reviewBanner"></div>
    <div id="warnings"></div>
  </section>

  <section class="panel" id="trainingPanel">
    <div class="stage-head"><h2 id="stageTitle">本轮判断</h2><span class="badge" id="stageBadge"></span></div>
    <div class="notice" id="instruction"></div>
    <div class="ab-grid" style="margin-top:14px"><article class="scheme" id="schemeA"></article><article class="scheme" id="schemeB"></article></div>
    <form class="feedback" id="feedbackForm"><div id="feedbackContent"></div><div class="actions"><button class="primary" type="submit">提交判断，进入下一组</button><span id="feedbackMessage" class="message"></span></div></form>
  </section>

  <section class="panel">
    <div class="stage-head"><h2>学习进度与结果</h2><span class="badge green" id="boundaryProgress"></span></div>
    <div class="tabs"><button type="button" data-tab="boundaries" aria-selected="true">单项复用极限</button><button type="button" data-tab="uta" aria-selected="false">UTA扣分曲线</button><button type="button" data-tab="reviews" aria-selected="false">需要复核</button></div>
    <div class="tabview active" id="tab-boundaries"><div class="legend"><span><i class="dot" style="background:#60c88a"></i>已确认可复用</span><span><i class="dot" style="background:#f2c94c"></i>正在夹逼</span><span><i class="dot" style="background:#e98178"></i>已确认不可复用</span></div><div class="progress-list" id="boundaryList" style="margin-top:12px"></div></div>
    <div class="tabview" id="tab-uta"><div id="utaSummary" class="notice"></div><div class="curve-grid" id="curveGrid" style="margin-top:12px"></div></div>
    <div class="tabview" id="tab-reviews"><div id="reviews"></div></div>
  </section>

  <details class="panel"><summary>开发人员设置与数据导出</summary><div class="details-body"><div class="toolbar"><div class="field"><label for="utaSegments">所有属性的UTA分段数</label><select id="utaSegments"></select></div><button type="button" id="saveSettings">重新训练</button></div><div class="footer-actions" style="margin-top:14px"><a href="/api/export-archive"><button type="button" class="secondary">导出完整训练档案</button></a><a href="/api/export-model"><button type="button" class="secondary">导出冻结复用模型</button></a><button type="button" class="warn" id="resetButton">清空本版状态</button></div></div></details>
  </section>
</main>
<script>
let appState=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'操作失败');return data;}
const post=(path,payload)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
function formatValue(value,spec){if(value===null||value===undefined)return '未填写';const number=Number(value);if(!Number.isFinite(number))return esc(value);const precision=Number(spec.precision??3),fixed=number.toFixed(precision);return precision===0?fixed:fixed.replace(/\.?0+$/,'')}
function byKey(){return Object.fromEntries((appState.project.attributes||[]).map(x=>[x.key,x]));}
function badge(text,kind=''){return `<span class="badge ${kind}">${esc(text)}</span>`}
function modelStatusLabel(value){return ({validated:'已验证',preliminary:'初步可用',needs_review:'需要复核',insufficient_data:'数据不足',no_data:'尚未开始',learned:'已学得',insufficient_classes:'类别不足',whole_scheme_supported:'整方案验证通过',pair_validation_only:'仅完成对比验证',unstable_on_holdout:'留出验证不稳定'}[value]||value||'尚未开始')}
function renderScheme(scheme){const specs=appState.project.attributes||[],changed=new Map((scheme.changed||[]).map(x=>[x.attribute_key,x]));const rows=specs.map(spec=>{const item=changed.get(spec.key),base=appState.baseline.params[spec.key],value=scheme.params[spec.key],delta=item?`<span class="delta">基准 ${formatValue(base,spec)} → 当前 ${formatValue(value,spec)}；退化 ${item.deterioration_percent_of_range}%</span>`:'';return `<tr class="${item?'changed':''}"><td><span class="param-label">${esc(spec.label)}</span><span class="param-meta">第 ${esc(spec.design_stage)} 批 · ${esc(spec.unit)}</span></td><td>${formatValue(value,spec)}${delta}</td></tr>`}).join('');return `<h3>方案 ${esc(scheme.id)}</h3><div class="source">${esc(scheme.source)} · 改变 ${esc(scheme.changed_count)} 项</div><table class="param-table"><tbody>${rows}</tbody></table>`}
function radioGroup(name,options){return `<div class="choice">${options.map(([value,label])=>`<label><input type="radio" name="${esc(name)}" value="${esc(value)}">${esc(label)}</label>`).join('')}</div>`}
function renderFeedback(){const pair=appState.pair,container=document.getElementById('feedbackContent');if(pair.stage==='single'){container.innerHTML=`<h3>方案 B 的退化指标是否仍能接受并复用？</h3>${radioGroup('reuseB',[['reusable','仍可复用'],['not_reusable','已不可复用'],['uncertain','暂时难判断']])}`}else{container.innerHTML=`<div class="feedback-grid"><div><h3>方案 A 整体是否还能复用？</h3>${radioGroup('reuseA',[['reusable','仍可复用'],['not_reusable','已不可复用'],['uncertain','暂时难判断']])}</div><div><h3>方案 B 整体是否还能复用？</h3>${radioGroup('reuseB',[['reusable','仍可复用'],['not_reusable','已不可复用'],['uncertain','暂时难判断']])}</div></div><div style="margin-top:14px"><h3>A 与 B 哪个更值得复用？</h3>${radioGroup('preference',[['A_strong','A明显更好'],['A_slight','A略好'],['tie','差不多'],['B_slight','B略好'],['B_strong','B明显更好'],['unknown','暂时无法比较']])}</div>`}}
function percent(value){return value===null||value===undefined?'待形成':Math.round(Number(value)*100)+'%'}
function openReviewTab(){const button=document.querySelector('[data-tab="reviews"]');if(button)button.click();document.getElementById('tab-reviews')?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderStatus(){const c=appState.learningCompletion,s=appState.stats,coverage=c.coverage||{},pairProgress=`${s.preferenceEvidence}/${c.minimum_preference_pairs||c.recommended_preference_pairs||'待定'}`,validation=c.validation_accuracy===null||c.validation_accuracy===undefined?'待形成':percent(c.validation_accuracy),cls=c.complete?'notice':'notice warn';document.getElementById('statusGrid').innerHTML=[[c.single_completed+'/'+c.single_total,'已完成单项极限'],[pairProgress,'有效偏好 / 最低数量'],[validation,'保守验证正确率'],[s.openReviews,'需要复核']].map(([num,label])=>`<div class="stat"><strong>${esc(num)}</strong><span>${esc(label)}</span></div>`).join('');const detail=c.status==='single_learning'?'当前先完成逐属性夹逼，完成后自动进入最多三属性组合学习。':`${esc(c.message||'')}<br><span class="subtitle">判断一致度 ${percent(c.judgment_consistency)} · 有效区段覆盖 ${percent(coverage.covered_ratio)} · 可靠覆盖 ${percent(coverage.reliable_ratio)} · 综合分界正确率 ${percent(c.threshold_accuracy)}。M1仅作研究诊断，不单独阻止完成。</span>`;const host=document.getElementById('completionText');host.className=cls;host.innerHTML=`<b>${esc(c.title)}</b><br>${detail}`;const reviews=Number(c.open_must_reviews||0),suggested=Number(c.open_suggested_reviews||0);document.getElementById('reviewBanner').innerHTML=reviews||suggested?`<div class="notice ${reviews?'error':'warn'} review-banner" onclick="openReviewTab()">${reviews?`有 ${reviews} 项必须复核`:`有 ${suggested} 项建议复核`}，点击查看原A/B方案并重新判断。</div>`:'';document.getElementById('boundaryProgress').textContent=`${Math.round(c.single_progress*100)}%`}
function renderBoundaries(){const list=document.getElementById('boundaryList');list.innerHTML=(appState.singleBoundaries||[]).map(item=>{const accepted=Math.max(0,Math.min(100,Number(item.accepted_d||0)*100)),rejected=item.rejected_d===null||item.rejected_d===undefined?100:Math.max(0,Math.min(100,Number(item.rejected_d)*100)),amber=Math.max(0,rejected-accepted),red=Math.max(0,100-rejected);let text='等待试探';if(item.status==='learned')text=`极限约 ${item.limit_value} ${item.unit}；夹逼区间 ${item.accepted_value}～${item.rejected_value}`;else if(item.status==='full_range_reusable')text='到生成最差边界仍可复用';else if(item.status==='unresolved')text='判断不确定，当前未形成极限';else if(item.observations.length)text=`已判断 ${item.observations.length} 次；确认可接受至 ${item.accepted_value} ${item.unit}`;return `<div class="boundary-row"><div class="boundary-name"><b>${esc(item.attribute_label)} · ${esc(item.side_label)}</b><span>基准 ${esc(item.baseline_value)} ${esc(item.unit)}</span></div><div class="track"><span class="accepted" style="width:${accepted}%"></span><span class="uncertain" style="left:${accepted}%;width:${amber}%"></span><span class="rejected" style="width:${red}%"></span></div><div class="boundary-value">${esc(text)}</div></div>`}).join('')||'<div class="empty">没有可训练的单项属性。</div>'}
function curveSvg(curve){const points=curve.points||[],max=Math.max(1,...points.map(p=>Number(p.loss_points||0))),path=points.map((p,i)=>`${i?'L':'M'} ${10+Number(p.deterioration)*280} ${135-Number(p.loss_points)/max*115}`).join(' ');return `<svg viewBox="0 0 300 150" role="img" aria-label="${esc(curve.attribute_label)}扣分曲线"><line x1="10" y1="135" x2="290" y2="135" stroke="#aab8c8"/><line x1="10" y1="20" x2="10" y2="135" stroke="#aab8c8"/><path d="${path}" fill="none" stroke="#1769e0" stroke-width="3"/><text x="10" y="148" font-size="10">基准</text><text x="254" y="148" font-size="10">最差边界</text></svg>`}
function renderUta(){const uta=appState.utaModel||{},threshold=appState.combinedReuseThreshold||{};document.getElementById('utaSummary').innerHTML=`<b>当前UTA：${esc(modelStatusLabel(uta.status))}</b><br>有效偏好 ${esc(uta.evidence_pairs||0)} 对；综合复用分界 ${threshold.threshold??'尚未形成'}；分界拟合正确率 ${threshold.accuracy===null||threshold.accuracy===undefined?'待形成':Math.round(threshold.accuracy*100)+'%'}。基准固定100分，所有曲线只表示向坏方向变化时的扣分。`;const curves=uta.marginal_loss_curves||[];document.getElementById('curveGrid').innerHTML=curves.map(curve=>`<div class="curve"><h4>${esc(curve.attribute_label)} · 权重 ${(Number(curve.attribute_weight||0)*100).toFixed(1)}%</h4>${curveSvg(curve)}</div>`).join('')||'<div class="empty">进入多属性阶段并获得有效A/B偏好后，才会形成UTA曲线。</div>'}
function reviewSchemePreview(scheme){if(!scheme)return '';const changed=scheme.changed||[];return `<div class="review-scheme"><b>方案 ${esc(scheme.id)}</b>${changed.map(x=>`<div>${esc(x.attribute_label)}：${esc(x.baseline_value)} → ${esc(x.value)} ${esc(x.unit)}</div>`).join('')||'<div>与基准相同</div>'}</div>`}
function renderReviews(){const reviews=appState.reviews||[];document.getElementById('reviews').innerHTML=reviews.map(item=>{const judgment=item.original_judgment||{},id=item.evidence_ids?.[0]||'';return `<div class="review ${item.tier==='must_review'?'must':''}"><b>${item.tier==='must_review'?'必须复核':'建议复核'}：${esc(item.message)}</b>${item.scheme_a||item.scheme_b?`<div class="review-preview">${reviewSchemePreview(item.scheme_a)}${reviewSchemePreview(item.scheme_b)}</div><div class="subtitle">原判断：A ${esc(item.original_judgment?.reuse_a||'未记录')}；B ${esc(item.original_judgment?.reuse_b||'未记录')}；偏好 ${esc(judgment.preference_label||judgment.preference||'未记录')}</div>`:''}<div class="review-actions"><button type="button" class="warn" onclick="resolveReview('${esc(item.id)}','${esc(id)}','rejudge')">重新判断这组A/B</button><button type="button" onclick="resolveReview('${esc(item.id)}','${esc(id)}','keep')">确认保留原判断</button><button type="button" class="secondary" onclick="resolveReview('${esc(item.id)}','${esc(id)}','withdraw')">撤回关联证据</button></div></div>`}).join('')||'<div class="empty">目前没有需要复核的判断。</div>'}
async function resolveReview(reviewId,evidenceId,action){try{render(await post('/api/review',{reviewId,evidenceId,action}));if(action==='rejudge')document.getElementById('trainingPanel').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){alert(error.message)}}
function renderEvalInputs(){const specs=appState.project.attributes||[],params=appState.evaluationBaseline?.params||appState.baseline.params||{};document.getElementById('evalInputs').innerHTML=specs.map(spec=>`<div class="field"><label for="eval-${esc(spec.key)}">${esc(spec.label)} · ${esc(spec.unit)}</label><input id="eval-${esc(spec.key)}" name="${esc(spec.key)}" type="${spec.data_type==='categorical'?'text':'number'}" step="any" value="${esc(params[spec.key])}"></div>`).join('')}
function statusKind(status){return status==='better_or_equal'||status==='single_reusable'?'green':status==='beyond_single_limit'?'red':'amber'}
function scoreGauge(r){const score=Number(r.effectiveness_score),rawThreshold=r.combined_reuse_threshold,hasThreshold=rawThreshold!==null&&rawThreshold!==undefined&&Number.isFinite(Number(rawThreshold)),threshold=hasThreshold?Number(rawThreshold):null,interval=r.effectiveness_interval||[score,score],x=v=>35+Math.max(0,Math.min(100,Number(v)))*6.2,thresholdMark=hasThreshold?`<line x1="${x(threshold)}" y1="24" x2="${x(threshold)}" y2="82" stroke="#c23b32" stroke-width="3"/><text x="${x(threshold)}" y="17" text-anchor="middle" font-size="12" fill="#9b2922">复用分界 ${esc(rawThreshold)}</text>`:'<text x="345" y="17" text-anchor="middle" font-size="12" fill="#68788b">综合复用分界尚未形成</text>';return `<svg class="chart-svg" viewBox="0 0 700 105" role="img" aria-label="效能分与复用分界"><line x1="35" y1="54" x2="655" y2="54" stroke="#d7e0eb" stroke-width="18"/><line x1="${x(interval[0])}" y1="54" x2="${x(interval[1])}" y2="54" stroke="#77a8e8" stroke-width="18"/>${thresholdMark}<circle cx="${x(score)}" cy="54" r="11" fill="#087f73"/><text x="35" y="96" font-size="12">0</text><text x="655" y="96" text-anchor="end" font-size="12">100</text></svg>`}
function waterfallSvg(items){const rows=(items||[]).filter(x=>Number(x.loss_points)>0.001),w=700,left=145,right=45,row=34,h=Math.max(95,45+rows.length*row),max=Math.max(1,...rows.map(x=>Number(x.loss_points)));return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="属性扣分贡献">${rows.map((x,i)=>{const y=30+i*row,bw=(w-left-right)*Number(x.loss_points)/max;return `<text x="0" y="${y+14}" font-size="13">${esc(x.attribute_label)}</text><rect x="${left}" y="${y}" width="${bw}" height="18" rx="3" fill="#d96b5f"/><text x="${Math.min(left+bw+6,w-right)}" y="${y+14}" font-size="12">-${Number(x.loss_points).toFixed(2)}</text>`}).join('')||'<text x="20" y="45" font-size="14">当前方案没有效能扣分。</text>'}</svg>`}
function marginBars(r){return (r.attributes||[]).map(item=>{const loss=Number(item.incremental_loss_points||0),limit=Number(item.rejected_loss_budget??item.accepted_loss_budget??0),ratio=limit>0?Math.min(130,loss/limit*100):(loss?130:0),color=ratio>=100?'#d96b5f':ratio>=80?'#e0a42e':'#39a96b';return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(item.attribute_label)}</b><span>${esc(item.status_label)}</span></div><div class="track"><span style="display:block;height:100%;width:${Math.min(100,ratio)}%;background:${color}"></span></div><div class="subtitle">当前增量扣分 ${loss.toFixed(2)}；${item.limit_value===null||item.limit_value===undefined?'极限待学习':`迁移后极限约 ${esc(item.limit_value)} ${esc(item.unit)}`}</div></div>`}).join('')}
function migrationCurveSvg(curve){const points=curve.points||[],w=360,h=220,left=42,right=14,top=20,bottom=42,pw=w-left-right,ph=h-top-bottom,rawValues=points.flatMap(p=>[Number(p.raw_value),Number(p.migrated_raw_value)]).filter(Number.isFinite),rawMin=Math.min(...rawValues),rawMax=Math.max(...rawValues),span=Math.max(1e-9,rawMax-rawMin),max=Math.max(1,...points.map(x=>Number(x.original_loss_points||0)),...points.map(x=>Number(x.migrated_loss_points||0))),xRaw=v=>left+(Number(v)-rawMin)/span*pw,yLoss=v=>top+ph-Number(v||0)/max*ph,path=(rawField,lossField)=>points.map((p,i)=>`${i?'L':'M'} ${xRaw(p[rawField])} ${yLoss(p[lossField])}`).join(' '),supportPoint=points.reduce((best,p)=>Math.abs(Number(p.deterioration)-Number(curve.support_max_deterioration))<Math.abs(Number(best.deterioration)-Number(curve.support_max_deterioration))?p:best,points[0]||{}),worst=points[points.length-1]||supportPoint,sx=xRaw(supportPoint.migrated_raw_value),wx=xRaw(worst.migrated_raw_value),nearest=points.reduce((best,p)=>Math.abs(Number(p.deterioration)-Number(curve.current_evaluation_deterioration))<Math.abs(Number(best.deterioration)-Number(curve.current_evaluation_deterioration))?p:best,points[0]||{}),limitLine=curve.migrated_limit_value===null||curve.migrated_limit_value===undefined?'':`<line x1="${xRaw(curve.migrated_limit_value)}" y1="${top}" x2="${xRaw(curve.migrated_limit_value)}" y2="${top+ph}" stroke="#d17b18" stroke-width="2" stroke-dasharray="4 3"/>`;return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(curve.attribute_label)}主曲线与迁移后曲线"><rect x="${Math.min(sx,wx)}" y="${top}" width="${Math.abs(wx-sx)}" height="${ph}" fill="#fff3d8"/><line x1="${left}" y1="${top+ph}" x2="${left+pw}" y2="${top+ph}" stroke="#9aa8b8"/><path d="${path('raw_value','original_loss_points')}" fill="none" stroke="#8997a8" stroke-width="2" stroke-dasharray="5 4"/><path d="${path('migrated_raw_value','migrated_loss_points')}" fill="none" stroke="#087f73" stroke-width="3"/><line x1="${xRaw(curve.evaluation_baseline_value)}" y1="${top}" x2="${xRaw(curve.evaluation_baseline_value)}" y2="${top+ph}" stroke="#1769e0" stroke-width="2"/>${limitLine}<circle cx="${xRaw(curve.current_value)}" cy="${yLoss(nearest.migrated_loss_points)}" r="6" fill="#c23b32"/><text x="${left}" y="${h-10}" font-size="10">${esc(Number(rawMin).toFixed(2))}</text><text x="${left+pw}" y="${h-10}" text-anchor="end" font-size="10">${esc(Number(rawMax).toFixed(2))} ${esc(curve.unit)}</text></svg><div class="legend"><span><i class="dot" style="background:#8997a8"></i>主基准曲线</span><span><i class="dot" style="background:#087f73"></i>当前基准迁移曲线</span><span><i class="dot" style="background:#d17b18"></i>迁移后极限</span><span><i class="dot" style="background:#fff0c7"></i>低置信外推区</span></div>`}
function renderEvaluation(record){const r=record.result,threshold=r.combined_reuse_threshold===null||r.combined_reuse_threshold===undefined?'待形成':r.combined_reuse_threshold,lossByKey=Object.fromEntries((r.loss_contributions||[]).map(x=>[x.attribute_key,x])),interval=r.effectiveness_interval?`${r.effectiveness_interval[0]}～${r.effectiveness_interval[1]}`:'待形成',migration=r.migration||{},curves=r.visualization?.marginal_curves||[];document.getElementById('evaluationResult').innerHTML=`<div class="scoreline"><div><div class="subtitle">相对当前评价基准效能分</div><div class="score">${esc(r.effectiveness_score)}</div><div class="subtitle">稳健区间 ${esc(interval)}</div></div><div>${badge(r.overall_reuse_label,r.overall_reuse_status==='reusable'?'green':r.overall_reuse_status==='not_reusable'?'red':'amber')}<br><span class="subtitle">综合复用分界：${esc(threshold)}<br>${esc(migration.label||'')}</span></div></div><div class="notice ${r.overall_reuse_status==='not_reusable'?'error':''}" style="margin-top:10px">${esc(r.conclusion)}<br><span class="subtitle">本结论只评价效能和复用，不评价物理可行性。换基准时逐属性迁移已学习的UTA曲线形状，并把优于当前基准的部分截断为100分；不允许属性间相互抵消。</span></div><div class="eval-dashboard"><div class="chart-box full-span"><h4>综合效能与整机复用结论</h4>${scoreGauge(r)}</div><div class="chart-box"><h4>属性效能扣分贡献</h4>${waterfallSvg(r.loss_contributions)}</div><div class="chart-box"><h4>逐属性效能与复用余量</h4>${marginBars(r)}</div><div class="chart-box full-span"><h4>各属性效能曲线与当前方案落点</h4><div class="migration-curves">${curves.map(c=>`<div class="migration-curve"><h5>${esc(c.attribute_label)} · 当前 ${esc(c.current_value)} ${esc(c.unit)}</h5>${migrationCurveSvg(c)}</div>`).join('')}</div></div></div><details open style="margin-top:14px"><summary>查看逐属性评分解释账本</summary><table class="result-table"><thead><tr><th>属性</th><th>基准 / 当前</th><th>单项复用结论</th><th>扣分</th></tr></thead><tbody>${(r.attributes||[]).map(item=>{const loss=lossByKey[item.attribute_key]?.loss_points||0,max=Math.max(1,...(r.loss_contributions||[]).map(x=>Number(x.loss_points||0)));return `<tr><td><b>${esc(item.attribute_label)}</b><br><span class="subtitle">退化 ${esc(item.deterioration_percent_of_range)}%</span></td><td>${esc(item.baseline_value)} → ${esc(item.current_value)} ${esc(item.unit)}</td><td>${badge(item.status_label,statusKind(item.status))}${item.limit_value===null||item.limit_value===undefined?'':`<br><span class="subtitle">当前极限约 ${esc(item.limit_value)} ${esc(item.unit)}</span>`}</td><td><b>${Number(loss).toFixed(2)} 分</b><div class="lossbar"><span style="width:${Math.min(100,Number(loss)/max*100)}%"></span></div></td></tr>`}).join('')}</tbody></table></details>`}
function renderWarnings(){const warnings=appState.project.warnings||[];document.getElementById('warnings').innerHTML=warnings.length?`<div class="notice warn" style="margin-top:10px"><b>数据提醒</b><br>${warnings.map(esc).join('<br>')}</div>`:''}
function renderProfiles(){const select=document.getElementById('profileSelect'),profiles=appState.project.profiles||[];select.innerHTML=profiles.map(p=>`<option value="${esc(p.id)}" ${p.id===appState.project.active_profile_id?'selected':''}>${esc(p.name)}</option>`).join('');const evaluation=appState.evaluationBaseline||appState.baseline;document.getElementById('baselineNote').innerHTML=`<b>训练主基准：${esc(appState.baseline.profile_name)}</b>；专家判断只训练这一套主模型。<br><b>当前评价基准：${esc(evaluation.profile_name)}</b>，切换较低基准时迁移每条属性UTA曲线的形状和复用极限，不重新训练。`}
function renderSettings(){const setting=appState.developerSettings,select=document.getElementById('utaSegments');select.innerHTML='';for(let value=setting.minimumSegments;value<=setting.maximumSegments;value++)select.insertAdjacentHTML('beforeend',`<option value="${value}" ${value===setting.utaSegments?'selected':''}>${value} 段</option>`)}
function render(state){appState=state;document.getElementById('projectTitle').textContent=`${state.project.name} · 主基准 ${state.baseline.profile_name}`;renderProfiles();renderStatus();renderWarnings();const reviewing=Boolean(state.pair.review_context);document.getElementById('stageTitle').textContent=reviewing?'复核旧A/B判断':state.phase==='single'?'第一阶段：逐属性寻找不可接受点':'第二阶段：最多三属性组合权衡';document.getElementById('stageBadge').textContent=reviewing?'只替换本组证据':state.phase==='single'?'每次只改1项':'每个方案最多3项';document.getElementById('instruction').textContent=state.pair.instruction;document.getElementById('schemeA').innerHTML=renderScheme(state.pair.a);document.getElementById('schemeB').innerHTML=renderScheme(state.pair.b);renderFeedback();renderBoundaries();renderUta();renderReviews();renderEvalInputs();renderSettings()}
document.getElementById('feedbackForm').addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('feedbackMessage');const checked=name=>document.querySelector(`input[name="${name}"]:checked`)?.value;const payload=appState.phase==='single'?{reuseB:checked('reuseB')}:{reuseA:checked('reuseA'),reuseB:checked('reuseB'),preference:checked('preference')};try{message.textContent='正在保存并生成下一组...';render(await post('/api/submit',payload));message.textContent='已保存。'}catch(error){message.textContent=error.message}});
document.getElementById('evaluationForm').addEventListener('submit',async event=>{event.preventDefault();const params={};for(const spec of appState.project.attributes){params[spec.key]=document.getElementById(`eval-${spec.key}`).value}const message=document.getElementById('evalMessage');try{message.textContent='正在评估...';const record=await post('/api/evaluate',{params});renderEvaluation(record);message.textContent='评估完成。'}catch(error){message.textContent=error.message}});
document.getElementById('profileSelect').addEventListener('change',async event=>{try{render(await post('/api/profile',{profileId:event.target.value}));document.getElementById('evaluationResult').innerHTML='<div class="empty">评价基准已切换，请确认参数后重新评估。</div>'}catch(error){alert(error.message)}});
document.getElementById('saveSettings').addEventListener('click',async()=>{try{render(await post('/api/settings',{utaSegments:Number(document.getElementById('utaSegments').value)}))}catch(error){alert(error.message)}});
document.getElementById('resetButton').addEventListener('click',async()=>{if(!confirm('确认清空V17锁特化版的全部点击状态？V15不会受到影响。'))return;try{render(await post('/api/reset',{}))}catch(error){alert(error.message)}});
function setWorkspace(name){const evaluation=name==='evaluation';document.getElementById('evaluationWorkspace').classList.toggle('hidden',!evaluation);document.getElementById('trainingWorkspace').classList.toggle('hidden',evaluation);document.querySelectorAll('[data-workspace]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.workspace===name)));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-workspace]').forEach(button=>button.addEventListener('click',()=>setWorkspace(button.dataset.workspace)));
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(item=>item.setAttribute('aria-selected',String(item===button)));document.querySelectorAll('.tabview').forEach(view=>view.classList.toggle('active',view.id===`tab-${button.dataset.tab}`))}));
api('/api/state').then(render).catch(error=>{document.getElementById('projectTitle').textContent=error.message});
</script>
</body>
