<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>深度分析 · 实际交互截图回放</title><style>body{font:16px Microsoft YaHei,Arial;background:#f3f7fb;color:#123452;margin:24px auto;max-width:1250px;padding:0 20px}img{max-width:100%;max-height:75vh;display:block;margin:18px auto;box-shadow:0 4px 20px #ccd6e3}button{padding:9px 20px;margin-right:12px;border:0;border-radius:6px;background:#245ac3;color:white;cursor:pointer}p{color:#60768e;font-size:13px}</style><h1>价格深度分析 · 实际交互回放</h1><p>综合实现 8ebe6c2；布尔控件修订 188a15d；虚拟数据验收。以下为真实浏览器操作截图的分步回放，并非实时录屏。点击图片可查看原图。</p><h2 id="caption"></h2><button id="previous">上一步</button><button id="next">下一步</button><button id="play">自动回放</button><a id="full" target="_blank"><img id="image"></a><script>const steps=[["01-portal.jpg", "1 · 从 Portal 进入深度价格分析"], ["03-edited-product-prediction.jpg", "2 · 选择产品并修改属性，得到预测价格"], ["04-single-sensitivity.jpg", "3 · 查看单参数价格敏感性曲线"], ["05-top10.jpg", "4 · 对全部可计算属性采样，查看 Top10"], ["06-scenario-comparison.jpg", "5 · 两项属性同时修改，比较情景价格"], ["07-real-model-metadata.jpg", "6 · 查看真实模型指标和未配置解释"], ["08-export-and-unconfigured-rule.jpg", "7 · 校正未配置时明确禁用，导出 CSV/TXT"]];let n=0,timer=null;function render(){document.getElementById('caption').textContent=steps[n][1];document.getElementById('image').src=steps[n][0];document.getElementById('full').href=steps[n][0]}document.getElementById('next').onclick=()=>{n=(n+1)%steps.length;render()};document.getElementById('previous').onclick=()=>{n=(n+steps.length-1)%steps.length;render()};document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='自动回放'}else{timer=setInterval(()=>{n=(n+1)%steps.length;render()},2500);this.textContent='暂停回放'}};render();</script></html>
