<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型库</title><link rel="stylesheet" href="/ui-theme.css"><style>body{margin:0;font:15px "Microsoft YaHei",sans-serif;color:#18354e;background:#f3f6fa}header{padding:18px 28px;display:flex;align-items:center;gap:18px}header h1{font-size:22px;margin:0}main{max-width:1250px;margin:24px auto;padding:0 22px}section,article{padding:20px;background:white;border:1px solid #dae3ed;border-radius:9px;margin:16px 0}label{display:inline-flex;flex-direction:column;gap:7px;margin:10px 16px 10px 0}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #c9d6e4;border-radius:5px}button,a.button{background:#16456c;color:white;cursor:pointer;text-decoration:none;margin:5px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5edf4}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{padding:12px;background:#edf5ff;white-space:pre-wrap}small{color:#61788d}textarea{min-width:500px;min-height:85px}.active{color:#16815d}</style><script defer src="/model-library.js"></script></head><body><header><h1>模型库</h1><a class="button" href="/portal" target="_top">返回系统导航</a></header><main><div id="status" role="status">正在读取模型库…</div><section><h2>接入模型</h2><p>模型会保存到用户数据目录，软件重启和升级后继续保留。支持本系统导出的机器学习模型、DS 三层模型和效能模型；可上传模型本体或单模型 ZIP。</p><label>模型类型<select id="role"><option value="price">价格模型（机器学习 / 三层）</option><option value="effectiveness">效能模型</option></select></label><label>库中名称<input id="name" placeholder="填写便于识别的名称"></label><label>模型文件<input id="file" type="file" accept=".zip,.pkl,.json"></label><details><summary>三层模型字段映射（已封装模型无需填写）</summary><label>英文业务代号 → DS 属性名称<textarea id="mapping" placeholder='{"part_type":"部件型号","part_count":"部件数量"}'></textarea></label></details><button id="install">检查并保存模型</button><small>检查失败会保留当前模型。切换只重启对应服务，不重新训练或覆盖业务数据。</small></section><section><h2>当前模型</h2><div id="current"></div></section><section><h2>已保存模型</h2><div id="items"></div></section><small id="storage"></small></main></body></html>
