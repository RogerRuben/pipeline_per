<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简易价格预测 V21</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/price_ensemble.css"></head>
<body class="effect-workbench-body">
<header class="app-header"><div class="brand-lockup"><div class="brand-mark">PR</div><div><div class="brand-title">简易价格预测 <span>V21.1.1</span></div><div class="brand-subtitle">快速估算成品参考价格</div></div></div><div class="header-actions"><span id="priceServiceStatus" class="system-pill"><i></i>正在连接价格服务</span><a class="button secondary" href="/portal">系统导航</a><a class="button secondary" href="/effectiveness">简易效能评价</a><a class="button secondary" href="/">智能推荐</a></div></header>
<main class="effect-workbench-shell"><section class="effect-intro price-intro"><div><div class="eyebrow">简易价格预测</div><h1 id="priceProductName">简易价格预测</h1><p>根据成品参数快速预测参考价格。页面已加载一个历史方案作为示例，您可以修改参数后重新预测。</p></div><details class="technical-details"><summary>技术信息</summary><div class="effect-model-meta"><div><span>成品代号</span><b id="priceProductCode">-</b></div><div><span>模型版本</span><b id="priceModelVersion">-</b></div><div><span>运行后端</span><b id="priceBackend">-</b></div></div></details></section>
<div id="priceError" class="workbench-message error hidden"></div><section class="effect-workbench-grid"><article class="effect-form-card"><div class="section-heading"><div><span class="step-index">01</span><h2>成品参数</h2><p>根据需要调整参数，再开始价格预测。</p></div><button id="priceResetBtn" class="button secondary">恢复示例</button></div><div id="priceExample" class="workbench-example">正在加载示例方案……</div><form id="priceForm"><div id="priceFields" class="effect-field-grid"><div class="loading-state"><div class="spinner"></div><b>正在读取参数</b></div></div><div class="effect-submit-bar"><div><b>确认参数</b><span>修改完成后点击按钮开始计算。</span></div><button id="pricePredictBtn" type="submit" class="button primary">开始价格预测</button></div></form></article>
<aside class="effect-result-column"><section id="priceEmpty" class="effect-empty"><div class="effect-empty-icon">¥</div><h2>等待预测</h2><p>这里将显示预测价格、参考区间和输入范围状态。</p></section><div id="priceResults" class="hidden"><section class="effect-score-card"><div class="effect-score-head"><div><span>预测价格（万元）</span><strong id="priceValue">-</strong><small>参考预测结果</small></div><span id="priceConfidence" class="effect-gate">-</span></div><div class="effect-score-metrics"><div><span>参考区间下限</span><b id="priceLower">-</b></div><div><span>参考区间上限</span><b id="priceUpper">-</b></div><div><span>输入范围状态</span><b id="priceDomain">-</b></div></div></section><section class="effect-detail-card"><h3>输入补全</h3><div id="priceFilled"></div></section><section class="effect-detail-card"><h3>范围提醒</h3><div id="priceWarnings"></div></section><details class="effect-detail-card technical-details"><summary>技术信息</summary><div id="priceTrace" class="effect-trace"></div></details></div></aside></section></main><div id="toast" class="toast hidden"></div><script src="/price_ensemble.js"></script><script src="/price.js"></script></body></html>
