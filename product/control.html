<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PipelinePer · 运行管理</title><link rel="icon" href="/launcher.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#142d44;font:14px "Microsoft YaHei",Arial,sans-serif}main{max-width:1160px;margin:36px auto;padding:0 24px}header,.brand{display:flex;align-items:center;gap:14px}header{justify-content:space-between}.brand img{width:48px;height:48px}h1{font-size:25px;margin:0 0 5px}small,.muted{color:#708192}section{background:white;border:1px solid #e1e8ee;border-radius:12px;padding:24px;margin-top:20px}h2{font-size:18px;margin:0 0 18px}.status{padding:7px 12px;border-radius:20px;background:#e8f5ef;color:#1a775d}.warn{background:#fff2d9;color:#94661a}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}button,a.button{font:inherit;text-decoration:none;background:#143c59;color:white;border:0;border-radius:6px;padding:10px 15px;cursor:pointer}button.secondary{background:#eef3f7;color:#25475f}button.danger{background:#fff0ee;color:#a54535}button:disabled{opacity:.42;cursor:default}.service{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:16px;padding:20px 0;border-top:1px solid #edf0f3}.service:first-child{border-top:0}.service strong{display:block;font-size:16px;margin-bottom:6px}.service code{display:block;color:#46657e;margin-top:6px}.pill{display:inline-block;color:#1d8063;background:#e8f6ef;padding:4px 9px;border-radius:20px}.pill.off{color:#728090;background:#eef1f4}.pill.bad{color:#a34836;background:#fff0eb}.service .actions{margin:0}.addresses{display:grid;grid-template-columns:1fr 1fr;gap:14px}.address{background:#f5f8fa;padding:16px;border-radius:7px}.address a{display:block;color:#176388;font:16px Consolas,monospace;margin-top:8px;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:120px 1fr;gap:12px;margin:20px 0 0}dt{color:#718193}dd{margin:0;overflow-wrap:anywhere}#message{margin-top:16px;white-space:pre-wrap;color:#315c76}#error{color:#a54535}.note{line-height:1.8;color:#64788c}@media(max-width:760px){.service,.addresses{grid-template-columns:1fr}header{align-items:flex-start}dl{grid-template-columns:1fr}main{margin:20px auto}}
</style></head><body><main><header><div class="brand"><img src="/launcher.svg" alt="PipelinePer"><div><h1>软件运行管理</h1><small>PipelinePer · 本机服务控制台</small></div></div><span id="state" class="status">正在读取</span></header>
<section><h2>访问地址</h2><div class="addresses"><div class="address">系统首页<a id="portal" href="#">读取中…</a></div><div class="address">运行管理<a id="control" href="#">读取中…</a></div></div><div class="actions"><a class="button" id="openPortal" href="#">打开系统首页</a><button class="secondary" id="refresh">刷新状态</button><button class="secondary" data-global="backup">备份数据与配置</button><button class="secondary" data-global="restart">重启全部服务</button><button class="danger" data-global="stop">退出软件</button></div><div id="message" role="status"></div><div id="error"></div></section>
<section><h2>独立服务</h2><div id="services"></div><p class="note">单独停止的服务会保持停止，其他服务继续运行。启动网页服务前，请先启动价格和效能服务。关闭浏览器后，后台服务继续运行。</p></section>
<section><h2>配置与数据</h2><dl><dt>软件版本</dt><dd id="version"></dd><dt>数据与模型</dt><dd id="classification"></dd><dt>端口配置文件</dt><dd id="config"></dd><dt>用户数据目录</dt><dd id="data"></dd><dt>软件目录</dt><dd id="package"></dd></dl><p class="note">修改端口配置后退出并重新启动软件。访问地址同时保存在用户目录 runtime/access.txt；也可运行 SHOW_ADDRESSES.bat 查看。恢复备份请使用 product.exe --restore，将备份还原到新的空目录。</p></section></main>
<script>var token=__TOKEN_JSON__,stopped=false,lastOperation=null;var names={price:'统一价格服务',effectiveness:'试用效能服务',web:'网页与业务服务'};var labels={starting:'正在启动',ready:'所有服务正常',degraded:'部分服务已停止或待处理',failed:'需要处理',stopping:'正在停止',stopped:'已停止'};
function text(id,v){document.getElementById(id).textContent=v||''}function button(label,action,role,disabled){var b=document.createElement('button');b.textContent=label;b.className=action==='stop'?'danger':'secondary';b.disabled=disabled;b.onclick=function(){send('/api/services/'+role+'/'+action)};return b}
async function refresh(){if(stopped)return;try{var r=await fetch('/api/status'),s=await r.json();text('state',labels[s.status]||s.status);document.getElementById('state').className='status'+(s.status==='ready'?'':' warn');text('error',s.error);text('version',s.version);text('classification',s.classification==='synthetic'?'虚拟数据 · V3 模型 · 试用效能':'本机模型 · 待业务验收');text('config',s.config_path);text('data',s.data_dir);text('package',s.package_dir);text('portal',s.portal_url||'网页尚未分配端口');text('control',s.control_url);document.getElementById('portal').href=s.portal_url||'#';document.getElementById('openPortal').href=s.portal_url||'#';document.getElementById('control').href=s.control_url;var box=document.getElementById('services');box.textContent='';Object.keys(names).forEach(function(k){var item=s.services[k],row=document.createElement('div');row.className='service';var title=document.createElement('div'),strong=document.createElement('strong');strong.textContent=names[k];title.appendChild(strong);var code=document.createElement('code');code.textContent=item.url||'启动后分配地址';title.appendChild(code);if(item.error){var error=document.createElement('small');error.textContent=item.error;title.appendChild(error)}var meta=document.createElement('div'),pill=document.createElement('span');pill.className='pill'+(item.alive?'':item.state==='failed'?' bad':' off');pill.textContent=item.alive?'运行中':item.paused?'已停止':item.state==='failed'?'启动失败':'待启动';meta.appendChild(pill);var pid=document.createElement('code');pid.textContent='进程 '+(item.pid||'—');meta.appendChild(pid);var actions=document.createElement('div');actions.className='actions';var busy=s.status==='starting';actions.appendChild(button('启动','start',k,item.alive||busy));actions.appendChild(button('停止','stop',k,!item.alive||busy));actions.appendChild(button('重启','restart',k,!item.alive||busy));row.appendChild(title);row.appendChild(meta);row.appendChild(actions);box.appendChild(row)});if(lastOperation){var op=(s.operations||[]).find(function(o){return o.id===lastOperation});if(op&&op.status==='succeeded'){text('message','服务操作已完成。');lastOperation=null}else if(op&&op.status==='failed'){text('message','操作失败：'+op.error);lastOperation=null}}}catch(e){text('state','无法连接管理服务')}}
async function send(path){try{var r=await fetch(path,{method:'POST',headers:{'X-Product-Token':token,'Content-Type':'application/json'},body:'{}'}),s=await r.json();if(!r.ok)throw Error(s.error);lastOperation=s.operation_id||null;text('message',s.backup?'备份已保存：'+s.backup:s.status==='stopping'?'软件正在退出，可以关闭本页。':'正在处理服务操作…');if(s.status==='stopping'){stopped=true;text('state','软件正在停止');document.querySelectorAll('button').forEach(function(b){b.disabled=true})}else setTimeout(refresh,500)}catch(e){text('message',e.message)}}
document.getElementById('refresh').onclick=refresh;document.querySelectorAll('[data-global]').forEach(function(b){b.onclick=function(){send('/api/'+b.dataset.global)}});refresh();setInterval(refresh,2000);</script></body></html>
