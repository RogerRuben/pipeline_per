<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PipelinePer · 软件运行管理</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f2f5fa;color:#213147;margin:0}main{max-width:980px;margin:50px auto;padding:0 24px}h1{font-size:28px}header{border-bottom:2px solid #234a72;padding-bottom:20px}section{background:white;padding:24px;border-radius:12px;margin-top:22px;box-shadow:0 5px 22px #1835570c}.badge{color:#8a590c;background:#fff3da;display:inline-block;padding:8px 12px;border-radius:6px}button,a{font:inherit;display:inline-block;background:#214f7d;color:white;padding:10px 16px;border:0;border-radius:6px;text-decoration:none;cursor:pointer;margin:5px 8px 5px 0}.danger{background:#8e3e3e}.secondary{background:#e9eef5;color:#254363}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #edf0f5}dt{font-weight:bold;margin-top:16px}dd{margin:5px 0;overflow-wrap:anywhere;color:#52627a}#message{white-space:pre-wrap}small{color:#61718a}button:disabled{opacity:.5;cursor:wait}</style></head>
<body><main><header><small>PipelinePer · 桌面交付原型</small><h1>软件运行管理</h1><span class="badge" id="classification">读取发布状态…</span></header>
<section><h2 id="state">正在读取</h2><p id="error"></p><a id="portal" href="#">打开系统首页</a><button class="secondary" data-action="backup">备份数据与配置</button><button class="secondary" data-action="restart">重新启动服务</button><button class="danger" data-action="stop">停止全部服务</button><p id="message" role="status"></p><small>关闭浏览器后服务继续运行。退出软件请点击“停止全部服务”。</small></section>
<section><h2>服务状态</h2><table><thead><tr><th>服务</th><th>状态</th><th>进程</th></tr></thead><tbody id="services"></tbody></table><dl><dt>软件版本</dt><dd id="version"></dd><dt>用户数据目录</dt><dd id="data"></dd><dt>软件目录</dt><dd id="package"></dd></dl></section>
<section><h2>重新打包与更新</h2><p>停止服务后，将新软件包解压到新目录，启动其中的 product.exe。使用相同用户数据目录即可继续使用原有 SQLite、配置和导出；启动时不会重新训练模型。</p><small>当前为原型包，尚未通过 Windows 7 实机验收。</small></section></main>
<script>const token=__TOKEN_JSON__;let stopped=false;const names={price:'统一价格服务',effectiveness:'试用效能服务',web:'Portal · 推荐 · 深度价格分析'};const states={starting:'正在启动服务',ready:'软件运行正常',failed:'服务需要处理',stopping:'正在停止',stopped:'软件已停止'};
function text(id,value){document.getElementById(id).textContent=value||''}
async function refresh(){if(stopped)return;try{const r=await fetch('/api/status'),s=await r.json();text('state',states[s.status]||s.status);text('classification',s.classification==='synthetic'?'虚拟数据 · 真实 V3 模型 · 试用效能':'模型分类：'+s.classification);text('error',s.error);text('version',s.version);text('data',s.data_dir);text('package',s.package_dir);if(s.portal_url)document.getElementById('portal').href=s.portal_url;const body=document.getElementById('services');body.replaceChildren();Object.keys(s.services).forEach(k=>{const tr=document.createElement('tr');[names[k]||k,s.services[k].alive?'运行中':'已退出',s.services[k].pid].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});body.appendChild(tr)})}catch(e){text('state','无法连接软件管理服务')} }
document.querySelectorAll('button[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const action=b.dataset.action;const r=await fetch('/api/'+action,{method:'POST',headers:{'X-Product-Token':token,'Content-Type':'application/json'},body:'{}'}),s=await r.json();if(!r.ok)throw Error(s.error);text('message',s.backup?'备份已保存：'+s.backup:action==='stop'?'软件正在退出，可以关闭本页。':'正在重新启动服务…');if(action==='stop'){stopped=true;text('state','软件正在停止');document.querySelectorAll('button').forEach(x=>x.disabled=true)}else setTimeout(refresh,1000)}catch(e){text('message',e.message)}finally{if(!stopped)b.disabled=false}});refresh();setInterval(refresh,2000);</script></body></html>
